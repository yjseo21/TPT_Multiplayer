name: multiplayer-native
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['mp-v*']
    paths: ['src/**', 'tests/multiplayer/**', 'tools/multiplayer/**', 'subprojects/**', 'meson*', '.github/workflows/multiplayer.yaml',
            'README.multiplayer.md']
  pull_request:
    paths: ['src/**', 'tests/multiplayer/**', 'tools/multiplayer/**', 'subprojects/**', 'meson*', '.github/workflows/multiplayer.yaml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb  # SDL headers need Xlib; the game test needs a display
      - run: python -m pip install meson==1.12.1 ninja
      - run: python tools/multiplayer/build.py --test
      - id: package
        run: python tools/multiplayer/package.py --name ${{ matrix.platform }} ${{ startsWith(github.ref, 'refs/tags/mp-v') && format('--version {0}', github.ref_name) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: TPT-Multiplayer-${{ matrix.platform }}
          path: ${{ steps.package.outputs.archive }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.platform }}
          path: build-native/meson-logs/
  # A tag such as mp-v1.0.0, pushed by a maintainer, publishes the four tested zips as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/mp-v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TPT-Multiplayer-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --repo "${GITHUB_REPOSITORY}" \
            --title "TPT Multiplayer ${GITHUB_REF_NAME#mp-v}" --notes "Builds for Windows, macOS (Apple Silicon and Intel) and Linux. See README.multiplayer.md inside each zip."
