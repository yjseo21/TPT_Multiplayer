name: multiplayer-native
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/multiplayer/**', 'tools/multiplayer/**', 'subprojects/**', 'meson*', '.github/workflows/multiplayer.yaml']
  pull_request:
    paths: ['src/**', 'tests/multiplayer/**', 'tools/multiplayer/**', 'subprojects/**', 'meson*', '.github/workflows/multiplayer.yaml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install meson==1.12.1 ninja
      - run: python tools/multiplayer/build.py --test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiplayer-${{ matrix.os }}
          path: |
            build-native/meson-logs/
            build-native/src/multiplayer/tpt-server*
            build-native/src/multiplayer/tpt-remote*
            build-native/powder*
            LICENSE
            README.multiplayer.md
